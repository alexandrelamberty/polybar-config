; Colors resources
; ~/.config/polybar/colors.ini
; TODO: Associate to Xresources colors
[colors]
background = #090B10
background-alt = ${xrdb:background}
foreground = #282828 
foreground-alt = ${xrdb:foreground}
primary =  #fabd2f 
secondary = ${xrdb:color3} 
alert = ${xrdb:color1} 
success = #008000 
warn = #f50a4d

; Additional colors
highlight = #83a598
highlight-alt = ${xrdb:color4}
accent = #d3869b
accent-alt = ${xrdb:color5}
info = #8ec07c
info-alt = ${xrdb:color6}
critical = #fb4934
critical-alt = ${xrdb:color7}
