; Polybar confiuration
; ~/.config/polybar/config.ini
; Alexandre Lamberty (mail@alexandrelamberty.com)
; https://github.com/polybar/polybar/wiki

include-file = ~/.config/polybar/hardware.conf
include-file = /home/eevos/.config/polybar/themes/dark.ini
include-file = ~/.config/polybar/layouts/default.ini
include-file = ~/.config/polybar/modules/internal/modules.ini
include-file = ~/.config/polybar/modules/custom/modules.ini

[settings] 
screenchange-reload = true

[global/wm]

[section/base]
width = 100%
height = 32
fixed-center = true
padding-left = 1
padding-right = 1
module-margin-left = 1
module-margin-right = 1
background = ${colors.background}
foreground = ${colors.foreground}
font-0 = Iosevka Nerd Font Mono:style:Regular:size=10;3
font-1 = Iosevka Nerd Font Mono:style:Regular:size=20;4
cursor-click = pointer
cursor-scroll = ns-resize
enable-ipc = true
