; Polybar built-in modules
; ~/.config/polybar/modules/internal/modules.ini
; Alexandre Lamberty (mail@alexandrelamberty.com)

; https://github.com/polybar/polybar/wiki/Module:-alsa
[module/alsa]
type = internal/alsa
mapped = true
interval = 5
click-right = alacritty -e alsamixer

format-volume = <label-volume>
format-volume-foreground = ${colors.foreground}
format-volume-prefix = %{T2}%{T-}
format-volume-prefix-foreground = ${colors.highlight}
format-volume-prefix-padding-right = 2

format-muted = <label-muted>
format-muted-foreground = ${colors.secondary}
format-muted-prefix = %{T2}󰝟%{T-}
format-muted-prefix-foreground = ${colors.warn}
format-muted-prefix-padding-right = 2

label-volume = %percentage%%
label-muted = "muted"

; Only applies if <ramp-volume> is used
ramp-volume-0 = %{T2}奄%{T-}
ramp-volume-1 = %{T2}墳%{T-}
ramp-volume-2 = %{T2}%{T-}

; If defined, it will replace <ramp-volume> when
; headphones are plugged in to `headphone_control_numid`
; If undefined, <ramp-volume> will be used for both
; Only applies if <ramp-volume> is used
ramp-headphones-0 = 
ramp-headphones-1 = 

; https://github.com/polybar/polybar/wiki/Module:-backlight
[module/backlight]
type = internal/backlight
; Use the following command to list available cards:
; $ ls -1 /sys/class/backlight/
card = intel_backlight 
; Available tags:
;   <label> (default)
;   <ramp>
;   <bar>
format = <label>
format-foreground = ${colors.accent}
format-prefix = %{T2}%{T-}
format-prefix-foreground = ${colors.highlight}
format-prefix-padding-right = 2

label = %percentage%%

; Only applies if <ramp> is used
ramp-0 = 🌕
ramp-1 = 🌔
ramp-2 = 🌓
ramp-3 = 🌒
ramp-4 = 🌑

; Only applies if <bar> is used
bar-width = 10
bar-indicator = |
bar-fill = ─
bar-empty = ─

[module/battery]
type = internal/battery
full-at = 99
low-at = 5
battery = ${hardware.battery}
adapter = ${hardware.battery-adapter}
poll-interval = 5

time-format = %H:%M

; Available tags:
;   <label-charging> (default)
;   <bar-capacity>
format-charging = <animation-charging> <ramp-capacity> <label-charging>

; Available tags:
;   <label-discharging> (default)
;   <bar-capacity>
;   <ramp-capacity>
;   <animation-discharging>
format-discharging = <animation-discharging> <ramp-capacity> <label-discharging>

; Available tags:
;   <label-full> (default)
;   <bar-capacity>
;   <ramp-capacity>
format-full = <ramp-capacity>

; Format used when battery level drops to low-at
; If not defined, format-discharging is used instead.
; Available tags:
;   <label-low>
;   <animation-low>
;   <bar-capacity>
;   <ramp-capacity>
; New in version 3.6.0
format-low = <label-low> <animation-low>

; Available tokens:
;   %percentage% (default) - is set to 100 if full-at is reached
;   %percentage_raw%
;   %time%
;   %consumption% (shows current charge rate in watts)
label-charging = %percentage%%

; Available tokens:
;   %percentage% (default) - is set to 100 if full-at is reached
;   %percentage_raw%
;   %time%
;   %consumption% (shows current discharge rate in watts)
label-discharging = %percentage%%

; Available tokens:
;   %percentage% (default) - is set to 100 if full-at is reached
;   %percentage_raw%
label-full = Fully charged

; Available tokens:
;   %percentage% (default) - is set to 100 if full-at is reached
;   %percentage_raw%
;   %time%
;   %consumption% (shows current discharge rate in watts)
; New in version 3.6.0
label-low = BATTERY LOW

; Only applies if <ramp-capacity> is used
ramp-capacity-0 = 󰁺
ramp-capacity-1 = 󰁼
ramp-capacity-2 = 󰁿
ramp-capacity-3 = 󰂂
ramp-capacity-4 = 󰁹
ramp-capacity-foreground = ${colors.secondary}

; Only applies if <bar-capacity> is used
bar-capacity-width = 10

; Only applies if <animation-charging> is used
animation-charging-0 = 󰁺
animation-charging-1 = 󰁼
animation-charging-2 = 󰁿
animation-charging-3 = 󰂂
animation-charging-4 = 󰁹
; Framerate in milliseconds
animation-charging-framerate = 750
animation-charging-foreground = ${colors.success}

; Only applies if <animation-discharging> is used
animation-discharging-0 = 󰁹
animation-discharging-1 = 󰂂
animation-discharging-2 = 󰁿
animation-discharging-3 = 󰁼
animation-discharging-4 = 󰁺
; Framerate in milliseconds
animation-discharging-framerate = 500
animation-discharging-foreground = ${colors.warn}

; Only applies if <animation-low> is used
; New in version 3.6.0
animation-low-0 = !
animation-low-1 = 
animation-low-framerate = 200

; https://github.com/polybar/polybar/wiki/Module:-cpu
[module/cpu]
type = internal/cpu
interval = 2
warn-percentage = 4

format = <label>
format-prefix = %{T2}%{T-}
format-prefix-foreground = ${colors.primary}
format-prefix-padding-right = 1

format-warn-foreground = ${colors.alert}

label = %percentage%%

label-warn = %

ramp-coreload-spacing = 1
ramp-coreload-0 = ▁
ramp-coreload-1 = ▂
ramp-coreload-2 = ▃
ramp-coreload-3 = ▄
ramp-coreload-4 = ▅
ramp-coreload-5 = ▆
ramp-coreload-6 = ▇
ramp-coreload-7 = █

; https://github.com/polybar/polybar/wiki/Module:-date
[module/date]
type = internal/date
interval = 5

; make this value null to show alt date
date = %Y-%m-%d% 
date-alt = %Y-%m-%d%
time = %H:%M
time-alt = %H:%M

format = <label>
format-prefix = %{T2}%{T-}
format-prefix-foreground = ${colors.highlight}
format-prefix-padding-right = 2

label = %date% %time%

; https://github.com/polybar/polybar/wiki/Module:-filesystem
[module/filesystem]
type = internal/fs
interval = 60
fixed-values = false
warn-percentage = 75
spacing = 0
mount-0 = /
mount-1 = /home

format-mounted-prefix = %{T2}%{T-}
format-mounted-prefix-foreground = ${colors.success}
format-mounted-prefix-padding = 2
format-mounted = <label-mounted>

format-unmounted = <label-unmounted>

format-warn-prefix = %{T2}%{T-}
format-warn-prefix-padding = 2
format-warn-prefix-foreground = ${colors.warn}
format-warn = <label-warn>

label-mounted = %free%

label-unmounted = %mountpoint% not mounted
label-unmounted-foreground = ${colors.foreground-alt}

label-warn = %mountpoint% %free%

; https://github.com/polybar/polybar/wiki/Module:-i3
[module/i3]
type = internal/i3
index-sort = true
wrapping-scroll = false
strip-wsnumbers = true

format = <label-state> <label-mode>
format-prefix = %{T2}%{T-}
format-prefix-foreground = ${colors.primary}
format-prefix-padding-right = 1

; focused = Active workspace on focused monitor
label-focused = %name%
label-focused-foreground = ${colors.success}
label-focused-padding = 1

; unfocused = Inactive workspace on any monitor
label-unfocused = %name%
label-unfocused-foreground = ${colors.foreground}
label-unfocused-padding = 1

; urgent = Workspace with urgency hint set
label-urgent = %name%
label-urgent-background = ${colors.alert}
label-urgent-padding = 1

; https://github.com/polybar/polybar/wiki/Module:-memory
[module/memory]
type = internal/memory
interval = 2
warn-percentage = 80

format = <label>
format-prefix = %{T2}%{T-} 
format-prefix-foreground = ${colors.primary}
format-prefix-padding-right = 1

format-warn = <label-warn>
format-warn-prefix = %{T2}%{T-}
format-warn-prefix-foreground = ${colors.warn}
format-warn-prefix-padding-right = 1

label = %percentage_used%%
label-warn = %percentage_used%% 
label-warn-foreground = ${colors.alert}

ramp-used-0 = ▁
ramp-used-1 = ▂
ramp-used-2 = ▃
ramp-used-3 = ▄
ramp-used-4 = ▅
ramp-used-5 = ▆
ramp-used-6 = ▇
ramp-used-7 = █

;; https://github.com/polybar/polybar/wiki/Module:-mpd
[module/mpd]
type = internal/mpd

format-prefix = %{T2}%{T-}
format-prefix-foreground = ${colors.primary}
format-prefix-padding-right = 2

format-online = <label-song> <label-time> <icon-prev> <icon-stop> <toggle> <icon-next>

format-offline = <label-offline>
label-offline = 🎜 mpd is offline

icon-prev = 
icon-stop = 
icon-play = 
icon-pause = 
icon-next = 

label-song =  %artist% - %title%
label-song-maxlen = 25
label-song-ellipsis = true

;; https://github.com/polybar/polybar/wiki/Module:-network
[module/network-eth]
type = internal/network
interface = ${hardware.eth}
interval = 3.0

format-connected-prefix = 
format-connected-prefix-foreground = ${colors.success}
format-connected-prefix-padding-right = 2

format-disconnected-prefix = 
format-disconnected-prefix-foreground = ${colors.warn}
format-disconnected-prefix-padding-right = 2

label-connected = %local_ip%

label-disconnected = " "
label-disconnected-foreground = ${colors.primary}

[module/network-wlan]
type = internal/network
interface = ${hardware.wlan} 
interface-type = wireless
interval = 3.0
ping-interval = 10

format-connected = <label-connected><ramp-signal>
format-connected-prefix = %{T2}󰀂%{T-}
format-connected-prefix-foreground = ${colors.success}
format-connected-prefix-padding-right = 0

format-disconnected = <label-disconnected>
format-disconnected-prefix = %{T2}ﲁ %{T-}
format-disconnected-prefix-foreground = ${colors.alert}
format-disconnected-prefix-padding-right = 0

label-connected =  %{A1:wicd-client -n:} %essid% %{A}
label-disconnected = %{A1:wicd-client -n:} disconnected %{A}
label-disconnected-foreground = ${colors.foreground-alt}

ramp-signal-0 = %{T2}󰤭󰢼{T-}
ramp-signal-1 = %{T2}󰤯%{T-}
ramp-signal-2 = %{T2}󰤟%{T-}
ramp-signal-3 = %{T2}󰤢%{T-}
ramp-signal-4 = %{T2}󰤥%{T-}
ramp-signal-5 = %{T2}󰤨%{T-}
ramp-signal-foreground = ${colors.success}

[module/network-ip]
type = internal/network
interface = ${hardware.wlan} 

format-connected = <label-connected>
format-connected-prefix = %{T2}󰲐%{T-}
format-connected-prefix-padding-right = 2
format-connected-prefix-foreground = ${colors.success}

label-connected = %local_ip%

[module/network-up]
type = internal/network
interface = ${hardware.wlan}

label-connected = "%upspeed:7%"
label-connected-foreground = #dc322f

format-connected = <label-connected>
format-connected-prefix = %{T2}󰛶%{T-}
format-connected-prefix-padding-right = 1
format-connected-prefix-foreground = ${colors.success}

[module/network-down]
type = internal/network
interface = ${hardware.wlan}

label-connected = "%downspeed:7%"
label-connected-foreground = #2aa198

format-connected = <label-connected>
format-connected-prefix = %{T2}󰛴%{T-}
format-connected-prefix-padding-right = 1
format-connected-prefix-foreground = ${colors.success}

;; https://github.com/polybar/polybar/wiki/Module:-temperature
[module/temperature]
type = internal/temperature
; To list all the zone types, run 
; $ for i in /sys/class/thermal/thermal_zone*; do echo "$i: $(<$i/type)"; done
thermal-zone = 0
interval = 0.5
warn-temperature = 50
; $ for i in /sys/class/hwmon/hwmon*/temp*_input; do echo "$(<$(dirname $i)/name): $(cat ${i%_*}_label 2>/dev/null || echo $(basename ${i%_*})) $(readlink -f $i)"; done
; TODO: Use variable
;for i in /sys/class/thermal/thermal_zone*; do echo "$i: $(<$i/type)"; don
hwmon-path = ${hardware.hwmon-path}

format = <ramp> <label>

format-warn = <ramp> <label-warn>
format-warn-underline = ${self.format-underline}

label = %temperature-c%

label-warn = %temperature-c%
label-warn-foreground = ${colors.warn}

ramp-0 = 
ramp-1 = 
ramp-2 = 
ramp-foreground = ${colors.primary}

;; https://polybar.readthedocs.io/en/stable/user/modules/tray.html
[module/tray]
type = internal/tray
tray-background = ${colors.background}
tray-foreground = ${colors.foreground}
tray-padding = 0px
tray-spacing = 0px
tray-size = 14
format-margin = 0px

;; https://github.com/polybar/polybar/wiki/Module:-xbacklight
[module/xbacklight]
type = internal/xbacklight

format = <label> <bar>
format-prefix = %{T2}%{T-}
format-prefix-foreground = ${colors.primary}

label = BL

bar-width = 10
bar-indicator = |
bar-indicator-foreground = ${colors.success}
bar-indicator-font = 2

bar-fill = ─
bar-fill-font = 2
bar-fill-foreground = ${colors.highlight-alt}

bar-empty = ─
bar-empty-font = 2
bar-empty-foreground = ${colors.foreground-alt}

;; https://github.com/polybar/polybar/wiki/Module:-xkeyboard 
[module/xkeyboard]
type = internal/xkeyboard

label-indicator-on = +%icon%
label-indicator-off = -%icon%
label-indicator-on-capslock = 󰘲

format-prefix = %{T2}%{T-}
format-prefix-foreground = ${colors.secondary}
format-prefix-padding-right = 2

blacklist-0 = num lock
blacklist-1 = scroll lock

;; https://github.com/polybar/polybar/wiki/Module:-xwindow
[module/xwindow]
type = internal/xwindow

label = %title:0:100%
label-foreground = ${colors.success}

