[module/bhop]
type = custom/script
exec = ~/.config/polybar/scripts/bhop.sh
label = %output%€
format-prefix = "%{T2}󱨛 %{T-}"
format-prefix-foreground = #FF4500
format = <label>
interval = 3600

[module/debian]
type = custom/text
content = %{T2}%{T-}
content-foreground = #FF4500
content-padding = 1
click-left = ~/.config/rofi/scripts/system.sh &

[module/tmux]
type = custom/script
exec = ~/.config/polybar/scripts/tmux_session.sh
interval = 3600
label = %output%
label-foreground = #008000
format-prefix = "%{T2}󱂬 %{T-}"
format-prefix-foreground = #008000
format = <label>
click-left = ~/.config/rofi/scripts/tmux.sh &

[module/logs]
type = custom/script
format-prefix = "%{T2}𧻓%{T-}"
format-prefix-padding-right = 2
format-prefix-foreground = #094f94
format = <label>
label = %output%
exec = ~/.config/polybar/scripts/tmux_session.sh   
interval = 3600

